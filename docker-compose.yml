version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ccs-hub-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ccs_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ccs_password}
      POSTGRES_DB: ${POSTGRES_DB:-ccs_hub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - ccs-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ccs_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ccs-hub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ccs-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: ccs-hub-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - ccs-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ccs-hub-backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ccs_user}:${POSTGRES_PASSWORD:-ccs_password}@postgres:5432/${POSTGRES_DB:-ccs_hub}
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - ccs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ccs-hub-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_WS_URL=ws://localhost:8000/ws
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - ccs-network

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ccs-hub-celery
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ccs_user}:${POSTGRES_PASSWORD:-ccs_password}@postgres:5432/${POSTGRES_DB:-ccs_hub}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend:/app
    networks:
      - ccs-network

  nginx:
    image: nginx:alpine
    container_name: ccs-hub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/development.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
      - frontend
    networks:
      - ccs-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  ccs-network:
    driver: bridge
